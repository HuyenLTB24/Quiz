<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Quiz Solver</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 280px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #eaeaea;
    }

    .header {
      background: linear-gradient(135deg, #16213e, #0f3460);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #0f3460;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #e94560, #533483);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    .header p {
      font-size: 11px;
      color: #aaa;
    }

    .content {
      padding: 16px;
    }

    /* Toggle Switch */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .toggle-label {
      font-size: 14px;
      font-weight: 500;
    }

    .toggle-switch {
      position: relative;
      width: 48px;
      height: 26px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #444;
      border-radius: 26px;
      transition: .3s;
    }

    .slider:before {
      content: '';
      position: absolute;
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: .3s;
    }

    input:checked + .slider {
      background: #e94560;
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    /* Status Card */
    .status-card {
      background: #16213e;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #0f3460;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .status-row:last-child {
      margin-bottom: 0;
    }

    .status-key {
      font-size: 12px;
      color: #aaa;
    }

    .status-value {
      font-size: 12px;
      font-weight: 600;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }

    .dot-green { background: #4caf50; }
    .dot-red   { background: #e94560; }
    .dot-yellow { background: #ffc107; box-shadow: 0 0 6px #ffc107; }

    /* Question preview */
    .question-preview {
      background: #0f3460;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 11px;
      color: #ccc;
      max-height: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 12px;
      border-left: 3px solid #e94560;
    }

    .question-preview.empty {
      color: #666;
      font-style: italic;
    }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-bottom: 8px;
    }

    .btn:last-child {
      margin-bottom: 0;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .btn-primary {
      background: linear-gradient(135deg, #e94560, #533483);
      color: white;
    }

    .btn-secondary {
      background: #0f3460;
      color: #eaeaea;
      border: 1px solid #1a4a80;
    }

    /* Footer */
    .footer {
      padding: 10px 16px;
      font-size: 10px;
      color: #555;
      text-align: center;
      border-top: 1px solid #0f3460;
    }

    .model-badge {
      display: inline-block;
      background: #0f3460;
      color: #aaa;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 10px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🤖</div>
    <div>
      <h1>AI Quiz Solver</h1>
      <p>Powered by Ollama (Local AI)</p>
    </div>
  </div>

  <div class="content">
    <!-- Enable / Disable toggle -->
    <div class="toggle-row">
      <span class="toggle-label">Auto-Solve</span>
      <label class="toggle-switch">
        <input type="checkbox" id="enableToggle" checked />
        <span class="slider"></span>
      </label>
    </div>

    <!-- Status card -->
    <div class="status-card">
      <div class="status-row">
        <span class="status-key">Status</span>
        <span class="status-value" id="statusText">
          <span class="dot dot-green"></span>Active
        </span>
      </div>
      <div class="status-row">
        <span class="status-key">Processing</span>
        <span class="status-value" id="processingText">Idle</span>
      </div>
      <div class="status-row">
        <span class="status-key">AI Model</span>
        <span class="status-value"><span class="model-badge">llama3</span></span>
      </div>
    </div>

    <!-- Last question preview -->
    <div class="question-preview empty" id="questionPreview">No question detected yet</div>

    <!-- Action buttons -->
    <button class="btn btn-primary" id="triggerBtn">⚡ Solve Now</button>
    <button class="btn btn-secondary" id="clearCacheBtn">🗑 Clear Cache</button>
  </div>

  <div class="footer">
    All processing is done locally via Ollama
  </div>

  <script src="popup.js"></script>
</body>
</html>
